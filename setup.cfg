[metadata]
license_file = LICENSE

[check-manifest]
ignore =
    tox.ini

[flake8]
# Enforced in CI: syntax errors, undefined names and other errors that are
# bugs rather than style. Style is not enforced.
select = E9,F63,F7,F82
exclude =
    .git,.tox,.venv,build,dist,docs-build

[tool:brunette]
line-length = 79
verbose = true
single-quotes = false

[tool:pytest]
python_files = *test*.py
testpaths = tests
norecursedirs=schwab build dist docs htmlcov

[coverage:run]
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    except ImportError
    def __repr__
    raise NotImplementedError
    raise DeprecationWarning
    deprecate
