name: tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]
        python:
        - version: "3.14"
          toxenv: py314
        - version: "3.13"
          toxenv: py313
        - version: "3.12"
          toxenv: py312
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - name: Set up Python ${{ matrix.python.version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
      with:
        python-version: ${{ matrix.python.version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[dev]"

    - name: Lint for errors (syntax, undefined names)
      run: python -m flake8 schwab bin examples tests

    - name: Test with tox ${{ matrix.python.toxenv }}
      env:
        TOXENV: ${{ matrix.python.toxenv }}
      run: tox

    - name: Report coverage
      if: matrix.python.version == '3.14'
      run: |
        coverage combine
        coverage report
        coverage xml

    - name: Upload coverage to Codecov  
      if: matrix.python.version == '3.14'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: GitHub

    - name: Check twine
      if: matrix.python.version == '3.14'
      run: |
        python -m build
        python -m twine check dist/*

  readthedocs-test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        python:
        - version: "3.14"
          toxenv: py314
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - name: Set up Python ${{ matrix.python.version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
      with:
        python-version: ${{ matrix.python.version }}

    - name: Install dependencies
      run: |
        python -m pip install -r docs/requirements.txt

    - name: Verify that documentation builds
      run: |
        sphinx-build -W docs/ docs-build
